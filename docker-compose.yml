services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: eventmesh_dashboard
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD}
      TZ: Asia/Shanghai
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - eventmesh_mysql_data:/var/lib/mysql
      - ../eventmesh-dashboard/eventmesh-dashboard-console/src/main/resources/eventmesh-dashboard.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  backend:
    build:
      context: ../eventmesh-dashboard
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_ADDRESS: mysql:3306
      DB_USERNAME: root
      DB_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Set a 32-byte JWT_SECRET}
      AUTH_BOOTSTRAP_USERNAME: ${AUTH_BOOTSTRAP_USERNAME:-admin}
      AUTH_BOOTSTRAP_DISPLAY_NAME: ${AUTH_BOOTSTRAP_DISPLAY_NAME:-System Administrator}
      AUTH_BOOTSTRAP_ORGANIZATION: ${AUTH_BOOTSTRAP_ORGANIZATION:-EventMesh}
      AUTH_BOOTSTRAP_ORGANIZATION_SLUG: ${AUTH_BOOTSTRAP_ORGANIZATION_SLUG:-eventmesh}
      AUTH_BOOTSTRAP_PASSWORD: ${AUTH_BOOTSTRAP_PASSWORD:-}
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:9898/eventmesh/dashboard/hello"]
      interval: 15s
      timeout: 5s
      start_period: 45s
      retries: 8
    restart: unless-stopped

  frontend:
    build:
      context: .
    ports:
      - "4173:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  eventmesh_mysql_data:
