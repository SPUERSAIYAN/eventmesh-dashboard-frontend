<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EventMesh 集群图 Dashboard Demo</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --panel: #ffffff;
      --text: #172033;
      --muted: #667085;
      --line: #dbe3ef;
      --blue: #2563eb;
      --green: #16a34a;
      --orange: #ea580c;
      --purple: #7c3aed;
      --cyan: #0891b2;
      --amber: #d97706;
      --red: #dc2626;
      --gray: #98a2b3;
      --shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 1120px;
      background:
        radial-gradient(circle at 10% -10%, rgba(37, 99, 235, 0.08), transparent 28%),
        radial-gradient(circle at 105% 0%, rgba(124, 58, 237, 0.07), transparent 25%),
        var(--bg);
      color: var(--text);
      font-family: Inter, "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button, input { font: inherit; }

    .app-shell { min-height: 100vh; }

    .topbar {
      height: 76px;
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 0 28px;
      background: rgba(255, 255, 255, 0.94);
      border-bottom: 1px solid #e8edf5;
      box-shadow: 0 4px 18px rgba(15, 23, 42, 0.04);
      position: sticky;
      top: 0;
      z-index: 50;
      backdrop-filter: blur(10px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 300px;
    }

    .brand-mark {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: linear-gradient(145deg, #1d4ed8, #3b82f6 65%, #60a5fa);
      color: #fff;
      display: grid;
      place-items: center;
      box-shadow: 0 8px 20px rgba(37, 99, 235, 0.28);
    }

    .brand-mark svg { width: 25px; height: 25px; }
    .brand h1 { margin: 0; font-size: 20px; letter-spacing: 0.2px; }
    .brand p { margin: 2px 0 0; font-size: 12px; color: var(--muted); }

    .env-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      height: 34px;
      padding: 0 12px;
      border-radius: 999px;
      background: #ecfdf3;
      color: #087a36;
      border: 1px solid #b7efca;
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
    }

    .env-pill::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #16a34a;
      box-shadow: 0 0 0 4px rgba(22, 163, 74, 0.12);
    }

    .top-stats {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .top-stat {
      min-width: 112px;
      padding: 8px 12px;
      border: 1px solid #e6ebf2;
      background: #fff;
      border-radius: 12px;
    }

    .top-stat span { display: block; color: var(--muted); font-size: 11px; }
    .top-stat strong { display: block; margin-top: 2px; font-size: 16px; }
    .top-stat.warning strong { color: var(--amber); }

    .updated {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
      margin-left: 6px;
    }

    main { padding: 20px 24px 28px; }

    .toolbar {
      min-height: 62px;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 10px 14px;
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid #e4eaf2;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.04);
      margin-bottom: 16px;
    }

    .tool-btn {
      height: 38px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 0 13px;
      border: 1px solid #d7deea;
      border-radius: 10px;
      background: #fff;
      color: #344054;
      cursor: pointer;
      transition: 0.18s ease;
      font-weight: 700;
      font-size: 13px;
    }

    .tool-btn:hover { border-color: #9db8ff; color: var(--blue); box-shadow: 0 4px 12px rgba(37, 99, 235, 0.08); }
    .tool-btn:disabled { opacity: 0.45; cursor: not-allowed; box-shadow: none; }
    .tool-btn.primary { background: #eff6ff; border-color: #bfdbfe; color: #1d4ed8; }

    .breadcrumb {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 370px;
      overflow: hidden;
    }

    .crumb {
      border: 0;
      background: transparent;
      color: #475467;
      cursor: pointer;
      padding: 6px 5px;
      border-radius: 7px;
      font-weight: 700;
      white-space: nowrap;
    }

    .crumb:hover { background: #f2f4f7; color: var(--blue); }
    .crumb.current { color: #101828; cursor: default; }
    .crumb-sep { color: #b4becd; }

    .stepper {
      display: flex;
      align-items: center;
      margin-left: 6px;
      min-width: 330px;
    }

    .step {
      display: flex;
      align-items: center;
      color: #98a2b3;
      font-size: 12px;
      font-weight: 700;
    }

    .step:not(:last-child)::after {
      content: "";
      width: 40px;
      height: 2px;
      margin: 0 8px;
      background: #e4e7ec;
    }

    .step-index {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      border: 1px solid #d0d5dd;
      background: #fff;
      margin-right: 6px;
      font-size: 11px;
    }

    .step.done, .step.active { color: #1d4ed8; }
    .step.done .step-index, .step.active .step-index { border-color: #93b4ff; background: #eaf1ff; color: #1d4ed8; }
    .step.done:not(:last-child)::after { background: #93b4ff; }

    .toolbar-spacer { flex: 1; }

    .search-box {
      width: 230px;
      height: 38px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 11px;
      border: 1px solid #d7deea;
      border-radius: 10px;
      background: #fff;
    }

    .search-box svg { width: 17px; height: 17px; color: #98a2b3; }
    .search-box input { width: 100%; border: 0; outline: 0; color: #344054; background: transparent; font-size: 13px; }

    .content-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 330px;
      gap: 16px;
      align-items: stretch;
    }

    .topology-panel, .inspector {
      background: rgba(255, 255, 255, 0.96);
      border: 1px solid #e3e9f2;
      border-radius: 18px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .panel-head {
      min-height: 72px;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 14px 18px;
      border-bottom: 1px solid #edf1f6;
      background: linear-gradient(180deg, #fff, #fbfcfe);
    }

    .panel-title-wrap { min-width: 0; }
    .panel-title-wrap h2 { margin: 0; font-size: 18px; }
    .panel-title-wrap p { margin: 4px 0 0; color: var(--muted); font-size: 12px; }
    .panel-head-actions { margin-left: auto; display: flex; gap: 8px; }

    .legend {
      min-height: 42px;
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 0 18px;
      border-bottom: 1px solid #edf1f6;
      color: #667085;
      font-size: 12px;
      background: #fcfdff;
    }

    .legend strong { color: #344054; margin-right: 2px; }
    .legend-item { display: inline-flex; align-items: center; gap: 6px; }
    .legend-dot { width: 8px; height: 8px; border-radius: 50%; }
    .legend-dot.healthy { background: var(--green); box-shadow: 0 0 0 4px rgba(22, 163, 74, 0.10); }
    .legend-dot.warning { background: var(--amber); box-shadow: 0 0 0 4px rgba(217, 119, 6, 0.10); }
    .legend-dot.error { background: var(--red); box-shadow: 0 0 0 4px rgba(220, 38, 38, 0.10); }
    .legend-dot.unknown { background: var(--gray); box-shadow: 0 0 0 4px rgba(152, 162, 179, 0.12); }

    .stage-scroll {
      overflow: auto;
      background:
        linear-gradient(#fff 23px, transparent 24px),
        linear-gradient(90deg, rgba(224, 231, 242, 0.35) 1px, transparent 1px),
        linear-gradient(rgba(224, 231, 242, 0.35) 1px, transparent 1px),
        #fbfcff;
      background-size: 100% 24px, 24px 24px, 24px 24px, auto;
      min-height: 710px;
    }

    .stage {
      width: 1180px;
      min-height: 690px;
      position: relative;
      margin: 0 auto;
      transition: height 0.25s ease;
    }

    #edgeLayer {
      position: absolute;
      inset: 0;
      width: 1180px;
      height: 100%;
      z-index: 1;
      overflow: visible;
      pointer-events: none;
    }

    #nodeLayer { position: absolute; inset: 0; z-index: 2; }

    .topology-node {
      --accent: #2563eb;
      --soft: #eff6ff;
      --border: #bfdbfe;
      position: absolute;
      display: flex;
      flex-direction: column;
      background: linear-gradient(180deg, rgba(255,255,255,0.98), rgba(255,255,255,0.94));
      border: 1px solid var(--border);
      border-top: 4px solid var(--accent);
      border-radius: 16px;
      box-shadow: 0 10px 26px rgba(15, 23, 42, 0.08);
      overflow: hidden;
      cursor: pointer;
      transform: translateZ(0);
      transition: transform 0.18s ease, box-shadow 0.18s ease, opacity 0.18s ease, border-color 0.18s ease;
      animation: nodeIn 0.24s ease both;
    }

    .topology-node:hover {
      transform: translateY(-3px);
      box-shadow: 0 16px 34px rgba(15, 23, 42, 0.13);
      border-color: color-mix(in srgb, var(--accent) 45%, #ffffff);
      z-index: 5;
    }

    .topology-node.highlight {
      box-shadow: 0 18px 42px rgba(37, 99, 235, 0.18);
      border-width: 2px;
      border-top-width: 5px;
    }

    .topology-node.selected {
      outline: 3px solid color-mix(in srgb, var(--accent) 22%, transparent);
      box-shadow: 0 16px 40px color-mix(in srgb, var(--accent) 19%, transparent);
    }

    .topology-node.search-dim { opacity: 0.24; filter: grayscale(0.6); }
    .topology-node.search-hit { outline: 3px solid rgba(250, 204, 21, 0.42); }

    .node-head {
      min-height: 66px;
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 12px 14px 10px;
      background: linear-gradient(180deg, var(--soft), rgba(255,255,255,0.75));
      border-bottom: 1px solid color-mix(in srgb, var(--border) 64%, #ffffff);
    }

    .node-icon {
      width: 38px;
      height: 38px;
      flex: 0 0 38px;
      display: grid;
      place-items: center;
      border-radius: 11px;
      background: #fff;
      color: var(--accent);
      border: 1px solid var(--border);
      box-shadow: 0 5px 14px rgba(15, 23, 42, 0.05);
    }

    .node-icon svg { width: 23px; height: 23px; }
    .node-title { min-width: 0; flex: 1; }
    .node-title strong { display: block; font-size: 15px; line-height: 1.25; color: #172033; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .node-title span { display: block; margin-top: 3px; font-size: 11px; color: #667085; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      height: 24px;
      padding: 0 8px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 800;
      white-space: nowrap;
      background: #f2f4f7;
      color: #475467;
    }

    .status-pill i { width: 7px; height: 7px; border-radius: 50%; background: var(--gray); }
    .status-pill.healthy { background: #ecfdf3; color: #087a36; }
    .status-pill.healthy i { background: var(--green); }
    .status-pill.warning { background: #fffaeb; color: #b54708; }
    .status-pill.warning i { background: var(--amber); }
    .status-pill.error { background: #fef3f2; color: #b42318; }
    .status-pill.error i { background: var(--red); }
    .status-pill.unknown { background: #f2f4f7; color: #667085; }

    .node-body {
      flex: 1;
      min-height: 0;
      padding: 12px 14px;
      overflow: hidden;
    }

    .node-footer {
      min-height: 42px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      border-top: 1px solid #eef2f6;
      background: #fcfdff;
      font-size: 11px;
    }

    .node-footer .metric { min-width: 0; }
    .node-footer .metric span { color: #98a2b3; margin-right: 4px; }
    .node-footer .metric strong { color: #344054; }
    .drill-hint { margin-left: auto; color: var(--accent); font-weight: 800; white-space: nowrap; }

    .tag-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .tag-item {
      display: flex;
      align-items: center;
      gap: 7px;
      min-height: 38px;
      padding: 8px 9px;
      border: 1px solid #edf0f4;
      border-radius: 10px;
      background: #fff;
      color: #344054;
      font-size: 12px;
      font-weight: 700;
    }

    .tag-item::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 3px;
      background: var(--accent);
      opacity: 0.82;
    }

    .core-layout { display: grid; grid-template-rows: 84px 1fr; gap: 10px; height: 100%; }
    .core-box { border: 1px solid var(--border); border-radius: 12px; background: color-mix(in srgb, var(--soft) 55%, #fff); padding: 10px 12px; }
    .core-box-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
    .core-box-head strong { font-size: 12px; color: #1f3e80; }
    .core-box-head span { font-size: 10px; color: #667085; }
    .registry-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .registry-chip { display: flex; align-items: center; gap: 7px; padding: 7px 9px; border-radius: 9px; background: #fff; border: 1px solid #e7ecf5; font-size: 11px; font-weight: 800; }
    .registry-chip i { width: 8px; height: 8px; border-radius: 50%; background: var(--green); }

    .mini-node-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
    .mini-node {
      min-width: 0;
      padding: 9px 8px;
      border-radius: 10px;
      border: 1px solid #e5eaf1;
      background: #fff;
      text-align: center;
    }
    .mini-server { width: 29px; height: 26px; margin: 0 auto 5px; position: relative; }
    .mini-server::before, .mini-server::after, .mini-server span {
      content: "";
      position: absolute;
      left: 2px;
      right: 2px;
      height: 6px;
      border-radius: 3px;
      background: var(--accent);
      box-shadow: inset -6px 0 rgba(255,255,255,0.24);
    }
    .mini-server::before { top: 1px; }
    .mini-server span { top: 10px; }
    .mini-server::after { top: 19px; }
    .mini-node b { display: block; font-size: 10px; color: #344054; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .mini-node small { display: inline-flex; align-items: center; gap: 4px; margin-top: 3px; font-size: 9px; color: #667085; }
    .mini-node small::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--green); }
    .mini-node.warning small::before { background: var(--amber); }

    .cluster-summary { height: 100%; display: flex; flex-direction: column; gap: 10px; }
    .cluster-summary .mini-node-row { flex: 1; align-items: stretch; }
    .cluster-note { font-size: 11px; line-height: 1.55; color: #667085; padding: 8px 10px; border-radius: 9px; background: #f8fafc; border: 1px dashed #d9e1ec; }

    .pipeline-flow { height: 100%; display: flex; flex-direction: column; justify-content: center; gap: 12px; }
    .pipeline-row { display: grid; grid-template-columns: 1fr auto 1fr auto 1fr; align-items: center; gap: 6px; }
    .pipeline-step { padding: 10px 6px; border: 1px solid var(--border); border-radius: 9px; text-align: center; background: #fff; font-size: 11px; font-weight: 800; }
    .pipeline-arrow { color: var(--accent); font-weight: 900; }

    .instance-body { display: flex; flex-direction: column; gap: 10px; }
    .instance-role { font-size: 11px; color: #667085; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .meter-row { display: grid; grid-template-columns: 44px 1fr 36px; align-items: center; gap: 7px; font-size: 10px; color: #667085; }
    .meter { height: 6px; border-radius: 999px; background: #edf1f6; overflow: hidden; }
    .meter span { display: block; height: 100%; width: var(--value); border-radius: inherit; background: linear-gradient(90deg, color-mix(in srgb, var(--accent) 75%, #fff), var(--accent)); }
    .instance-mini-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
    .instance-mini-stats div { padding: 7px 8px; border-radius: 9px; background: #f8fafc; border: 1px solid #edf1f5; }
    .instance-mini-stats span { display: block; font-size: 9px; color: #98a2b3; }
    .instance-mini-stats strong { display: block; margin-top: 2px; font-size: 11px; color: #344054; }

    .topology-node.compact .node-head { min-height: 54px; padding: 9px 10px; gap: 8px; }
    .topology-node.compact .node-icon { width: 31px; height: 31px; flex-basis: 31px; border-radius: 9px; }
    .topology-node.compact .node-icon svg { width: 19px; height: 19px; }
    .topology-node.compact .node-title strong { font-size: 13px; }
    .topology-node.compact .node-title span { font-size: 9px; }
    .topology-node.compact .status-pill { width: 18px; height: 18px; padding: 0; justify-content: center; }
    .topology-node.compact .status-pill i { width: 7px; height: 7px; }
    .topology-node.compact .status-label-text { display: none; }
    .topology-node.compact .node-body { padding: 8px 10px; }
    .topology-node.compact .node-footer { min-height: 29px; padding: 5px 9px; }
    .topology-node.compact .node-footer .metric { display: none; }
    .topology-node.compact .drill-hint { font-size: 9px; }
    .topology-node.compact .instance-body { gap: 6px; }
    .topology-node.compact .meter-row { grid-template-columns: 30px 1fr 26px; gap: 4px; font-size: 8px; }
    .topology-node.compact .instance-mini-stats { display: none; }

    .stage-annotation {
      position: absolute;
      z-index: 3;
      transform: translateX(-50%);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(255,255,255,0.93);
      border: 1px solid #dfe6f0;
      color: #344054;
      font-size: 12px;
      font-weight: 800;
      box-shadow: 0 6px 16px rgba(15, 23, 42, 0.05);
      pointer-events: none;
      white-space: nowrap;
    }
    .stage-annotation::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--annotation, var(--blue)); }

    .edge {
      fill: none;
      stroke-width: 2.2;
      opacity: 0.78;
      transition: opacity 0.16s ease, stroke-width 0.16s ease;
    }
    .edge.flow { stroke-dasharray: 9 8; animation: flow 1.7s linear infinite; }
    .edge.active { opacity: 1; stroke-width: 4; filter: drop-shadow(0 0 3px rgba(37,99,235,0.22)); }
    .edge-label rect { fill: rgba(255,255,255,0.94); stroke: #e2e8f0; rx: 8; }
    .edge-label text { fill: #667085; font-size: 10px; font-weight: 800; text-anchor: middle; dominant-baseline: middle; }

    .panel-foot {
      min-height: 46px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 16px;
      border-top: 1px solid #edf1f6;
      background: #fcfdff;
      color: #667085;
      font-size: 12px;
    }
    .panel-foot svg { width: 17px; height: 17px; color: #64748b; }
    .panel-foot strong { color: #344054; }

    .inspector { min-height: 822px; display: flex; flex-direction: column; }
    .inspector-head { min-height: 72px; display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid #edf1f6; background: linear-gradient(180deg, #fff, #fbfcfe); }
    .inspector-head h3 { margin: 0; font-size: 16px; }
    .inspector-head p { margin: 3px 0 0; color: #98a2b3; font-size: 11px; }
    .close-inspector { margin-left: auto; width: 32px; height: 32px; display: grid; place-items: center; border: 1px solid #e0e6ef; background: #fff; border-radius: 9px; cursor: pointer; color: #667085; }
    .close-inspector:hover { color: var(--blue); border-color: #b8ccff; }
    .inspector-body { flex: 1; padding: 16px; overflow: auto; }

    .empty-inspector { height: 100%; min-height: 650px; display: grid; place-items: center; text-align: center; color: #98a2b3; }
    .empty-inspector .empty-icon { width: 76px; height: 76px; margin: 0 auto 14px; border-radius: 22px; display: grid; place-items: center; background: #f2f6ff; color: #6687d9; }
    .empty-inspector svg { width: 38px; height: 38px; }
    .empty-inspector strong { display: block; color: #475467; font-size: 14px; }
    .empty-inspector p { margin: 7px 0 0; max-width: 230px; font-size: 12px; line-height: 1.65; }

    .detail-hero { padding: 14px; border: 1px solid #e7ecf3; border-radius: 14px; background: linear-gradient(145deg, #f8fbff, #fff); }
    .detail-title-row { display: flex; align-items: center; gap: 10px; }
    .detail-icon { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; background: #eff6ff; color: var(--blue); border: 1px solid #cfe0ff; }
    .detail-icon svg { width: 24px; height: 24px; }
    .detail-title-row h4 { margin: 0; font-size: 16px; }
    .detail-title-row p { margin: 3px 0 0; color: #667085; font-size: 11px; }
    .detail-status { margin-left: auto; }

    .resource-track { height: 8px; border-radius: 999px; overflow: hidden; background: #edf1f6; }
    .resource-track span { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #60a5fa, #2563eb); }
    .resource-track.warning span { background: linear-gradient(90deg, #fbbf24, #d97706); }

    .spark-card { padding: 11px; border: 1px solid #e7ecf3; border-radius: 12px; background: #fff; }
    .spark-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 7px; }
    .spark-head span { font-size: 10px; color: #98a2b3; }
    .spark-head strong { font-size: 13px; color: #344054; }
    .spark-card svg { width: 100%; height: 62px; overflow: visible; }

    .detail-table { width: 100%; border-collapse: collapse; font-size: 11px; }
    .detail-table td { padding: 9px 0; border-bottom: 1px solid #eef1f5; }

    .detail-table td:last-child { text-align: right; color: #344054; font-weight: 700; }

    .log-item time { color: #98a2b3; }
    .log-item span { color: #475467; }
    .log-item.warning span { color: #b54708; }

    .toast {

      color: #fff;
      box-shadow: 0 18px 40px rgba(15,23,42,0.28);
      font-size: 12px;
      opacity: 0;
      transform: translateY(12px);
      pointer-events: none;
      transition: 0.22s ease;
      z-index: 100;
    }
    .toast.show { opacity: 1; transform: translateY(0); }

    @keyframes nodeIn { from { opacity: 0; transform: translateY(8px) scale(0.985); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes flow { to { stroke-dashoffset: -34; } }

    @media (max-width: 1350px) {
      .content-grid { grid-template-columns: 1fr; }
      .inspector { min-height: auto; }
      .empty-inspector { min-height: 180px; }
    }

<body>
  <div class="app-shell">
    <header class="topbar">

  <div class="toast" id="toast"></div>

      };
      return map[name] || map.runtime;
    }

    function hashValue(text) {
      return [...text].reduce((sum, char) => (sum * 31 + char.charCodeAt(0)) % 10007, 17);
    }

    function makeDetail(id, role, overrides = {}) {
      const h = hashValue(id);
      const cpu = overrides.cpu ?? (24 + (h % 53));
      const memory = overrides.memory ?? (38 + ((h * 3) % 49));
      const latency = overrides.latency ?? (7 + (h % 25));
      const throughput = overrides.throughput ?? `${(1.2 + (h % 62) / 10).toFixed(1)}k/s`;
      const connections = overrides.connections ?? (82 + (h % 410));
      const address = overrides.address ?? `10.0.${1 + (h % 8)}.${10 + (h % 180)}:${10000 + (h % 900)}`;
      const version = overrides.version ?? (role.includes('Kafka') ? '3.7.0' : role.includes('Pulsar') ? '3.2.2' : role.includes('Rocket') ? '5.3.1' : '1.11.0');
      const values = Array.from({ length: 18 }, (_, i) => 28 + ((h + i * 17 + (i % 3) * 9) % 58));
      return {
        role,
        address,
        version,
        uptime: overrides.uptime ?? `${7 + (h % 22)} 天 ${2 + (h % 18)} 小时`,
        cpu,
        memory,
        latency,
        throughput,
        connections,
        events: overrides.events ?? `${(2.4 + (h % 74) / 10).toFixed(1)}k/s`,
        values,
        logs: overrides.logs ?? [
          ['10:42:18', '健康检查通过，节点响应正常'],
          ['10:41:52', `处理事件流量 ${throughput}`],
          ['10:40:30', '配置中心同步完成']
        ]
      };
    }

    function leafNode(config) {
      const status = config.status || 'healthy';
      const role = config.role || config.subtitle || '节点实例';
      return {
        bodyType: 'instance',
        icon: 'runtime',
        theme: 'blue',
        w: 220,
        h: 220,
        ...config,
        status,
        detail: makeDetail(config.id, role, config.detail || {})
      };
    }

    const views = {

        annotations: [{ x: 590, y: 465, text: '消息中间件（Event Store）', theme: 'purple' }],
        nodes: [

        nodes: [
          {
            id: 'runtimeSource', title: '事件入口', subtitle: 'Producer / SDK', icon: 'source', theme: 'green', status: 'healthy',
            x: 20, y: 260, w: 150, h: 160, bodyType: 'list', items: ['HTTP', 'gRPC', 'MQTT'],
            metrics: [{ label: 'QPS', value: '12.8k' }], detail: makeDetail('runtimeSource', '事件入口网关', { address: 'eventmesh-gateway:8080', cpu: 33, memory: 48 })
          },

          leafNode({ id: 'Bookie-03', title: 'Bookie-03', subtitle: 'Storage Node', icon: 'bookie', theme: 'cyan', status: 'healthy', x: 610, y: 395, w: 200, h: 175, role: 'Pulsar Bookie', detail: { address: '10.3.2.13:3181', cpu: 42, memory: 69 } }),
          leafNode({ id: 'Bookie-04', title: 'Bookie-04', subtitle: 'Storage Node', icon: 'bookie', theme: 'cyan', status: 'healthy', x: 860, y: 395, w: 200, h: 175, role: 'Pulsar Bookie', detail: { address: '10.3.2.14:3181', cpu: 39, memory: 66 } })
        ],
        edges: [
          { from: 'Broker-01', to: 'Broker-02', theme: 'blue', bidirectional: true },
          { from: 'Broker-02', to: 'Broker-03', theme: 'blue', bidirectional: true },
          { from: 'Broker-02', to: 'Bookie-01', theme: 'cyan', flow: true },
          { from: 'Broker-02', to: 'Bookie-02', theme: 'cyan', flow: true },
          { from: 'Broker-02', to: 'Bookie-03', theme: 'cyan', flow: true },
          { from: 'Broker-02', to: 'Bookie-04', theme: 'cyan', flow: true }
        ]
      }
    };

    const state = {
      path: ['overview'],
      selectedId: null,
      search: '',
      demoTimers: []
    };

    const el = {
      stage: document.getElementById('stage'),
      edgeLayer: document.getElementById('edgeLayer'),
      nodeLayer: document.getElementById('nodeLayer'),
      viewTitle: document.getElementById('viewTitle'),
      viewSubtitle: document.getElementById('viewSubtitle'),
      breadcrumb: document.getElementById('breadcrumb'),
      backBtn: document.getElementById('backBtn'),
      homeBtn: document.getElementById('homeBtn'),
      demoBtn: document.getElementById('demoBtn'),
      searchInput: document.getElementById('searchInput'),
      inspectorBody: document.getElementById('inspectorBody'),
      closeInspector: document.getElementById('closeInspector'),
      refreshBtn: document.getElementById('refreshBtn'),
      updatedAt: document.getElementById('updatedAt'),
      throughputTop: document.getElementById('throughputTop'),
      latencyTop: document.getElementById('latencyTop'),
      toast: document.getElementById('toast'),
      brandIcon: document.getElementById('brandIcon')
    };

    function currentViewId() { return state.path[state.path.length - 1]; }
    function currentView() { return views[currentViewId()]; }

    function statusPill(status) {
      return `<span class="status-pill ${status}"><i></i><span class="status-label-text">${statusText[status] || '未知'}</span></span>`;
    }

    function renderBody(node) {
      if (node.bodyType === 'core') {
        return `
          <div class="core-layout">
            <div class="core-box">
              <div class="core-box-head"><strong>注册 / 元数据</strong><span>服务发现与配置</span></div>
              <div class="registry-row">
                <div class="registry-chip"><i></i>etcd 集群</div>
                <div class="registry-chip"><i></i>Nacos（可选）</div>
              </div>
            </div>
            <div class="core-box">
              <div class="core-box-head"><strong>Runtime 集群</strong><span>协议转换 · 路由 · 转发</span></div>
              <div class="mini-node-row">
                ${['Runtime-01', 'Runtime-02', 'Runtime-03'].map((label, i) => `
                  <div class="mini-node ${i === 2 ? 'warning' : ''}"><div class="mini-server"><span></span></div><b>${label}</b><small>${i === 2 ? '警告' : '正常'}</small></div>
                `).join('')}
              </div>
            </div>
          </div>`;
      }

      if (node.bodyType === 'list') {
        return `<div class="tag-grid">${(node.items || []).map(item => `<div class="tag-item">${typeof item === 'string' ? item : item.label}</div>`).join('')}</div>`;
      }

      if (node.bodyType === 'cluster') {
        return `
          <div class="cluster-summary">
            <div class="mini-node-row">
              ${(node.items || []).map(item => {
                const obj = typeof item === 'string' ? { label: item } : item;
                return `<div class="mini-node ${obj.status === 'warning' ? 'warning' : ''}"><div class="mini-server"><span></span></div><b>${obj.label}</b><small>${obj.status === 'warning' ? '警告' : '正常'}</small></div>`;
              }).join('')}
            </div>
            ${node.note ? `<div class="cluster-note">${node.note}</div>` : ''}
          </div>`;
      }

      if (node.bodyType === 'pipeline') {
        return `
          <div class="pipeline-flow">
            <div class="pipeline-row">
              <div class="pipeline-step">Source</div><div class="pipeline-arrow">→</div>
              <div class="pipeline-step">Topic</div><div class="pipeline-arrow">→</div>
              <div class="pipeline-step">Sink</div>
            </div>
            <div class="cluster-note">可用于同步、分发和数据集成</div>
          </div>`;
      }

      if (node.bodyType === 'instance') {
        const d = node.detail || makeDetail(node.id, node.subtitle || '节点实例');
        return `
          <div class="instance-body">
            <div class="instance-role">${d.role}</div>
            <div class="meter-row"><span>CPU</span><div class="meter"><span style="--value:${d.cpu}%"></span></div><b>${d.cpu}%</b></div>
            <div class="meter-row"><span>内存</span><div class="meter"><span style="--value:${d.memory}%"></span></div><b>${d.memory}%</b></div>
            <div class="instance-mini-stats">
              <div><span>吞吐</span><strong>${d.throughput}</strong></div>
              <div><span>延迟</span><strong>${d.latency} ms</strong></div>
            </div>
          </div>`;
      }

      return '<div class="cluster-note">点击查看组件详情</div>';
    }

    function renderFooter(node) {
      const metrics = (node.metrics || []).map(m => `<span class="metric"><span>${m.label}</span><strong>${m.value}</strong></span>`).join('');
      const hint = node.drill ? '点击进入 →' : '点击查看详情';
      return `<div class="node-footer">${metrics}<span class="drill-hint">${hint}</span></div>`;
    }

    function renderNodes(view) {
      const html = [];

      (view.annotations || []).forEach(a => {
        const theme = themes[a.theme] || themes.blue;
        html.push(`<div class="stage-annotation" style="left:${a.x}px;top:${a.y}px;--annotation:${theme.accent}">${a.text}</div>`);
      });

      view.nodes.forEach((node, index) => {
        const theme = themes[node.theme] || themes.blue;
        const selected = state.selectedId === node.id ? ' selected' : '';
        const compact = node.compact || node.w <= 170 ? ' compact' : '';
        const highlight = node.highlight ? ' highlight' : '';
        html.push(`
          <article class="topology-node${selected}${compact}${highlight}" data-id="${node.id}" role="button" tabindex="0"
            style="left:${node.x}px;top:${node.y}px;width:${node.w}px;height:${node.h}px;--accent:${theme.accent};--soft:${theme.soft};--border:${theme.border};animation-delay:${Math.min(index * 24, 180)}ms">
            <div class="node-head">
              <div class="node-icon">${icon(node.icon)}</div>
              <div class="node-title"><strong>${node.title}</strong><span>${node.subtitle || ''}</span></div>
              ${statusPill(node.status || 'unknown')}
            </div>
            <div class="node-body">${renderBody(node)}</div>
            ${renderFooter(node)}
          </article>`);
      });

      el.nodeLayer.innerHTML = html.join('');
      applySearch();
    }

    function edgeGeometry(from, to) {
      const fromCenter = { x: from.x + from.w / 2, y: from.y + from.h / 2 };
      const toCenter = { x: to.x + to.w / 2, y: to.y + to.h / 2 };
      const dx = toCenter.x - fromCenter.x;
      const dy = toCenter.y - fromCenter.y;

      let start, end, path, labelX, labelY;
      if (Math.abs(dx) >= Math.abs(dy)) {
        start = { x: from.x + (dx >= 0 ? from.w : 0), y: fromCenter.y };
        end = { x: to.x + (dx >= 0 ? 0 : to.w), y: toCenter.y };
        const midX = (start.x + end.x) / 2;
        path = `M ${start.x} ${start.y} C ${midX} ${start.y}, ${midX} ${end.y}, ${end.x} ${end.y}`;
        labelX = midX;
        labelY = (start.y + end.y) / 2 - 10;
      } else {
        start = { x: fromCenter.x, y: from.y + (dy >= 0 ? from.h : 0) };
        end = { x: toCenter.x, y: to.y + (dy >= 0 ? 0 : to.h) };
        const midY = (start.y + end.y) / 2;
        path = `M ${start.x} ${start.y} C ${start.x} ${midY}, ${end.x} ${midY}, ${end.x} ${end.y}`;
        labelX = (start.x + end.x) / 2 + 8;
        labelY = midY - 9;
      }
      return { path, labelX, labelY };
    }

    function renderEdges(view) {
      const nodeMap = Object.fromEntries(view.nodes.map(n => [n.id, n]));
      const markerDefs = Object.entries(themes).map(([key, t]) => `
        <marker id="arrow-${key}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M 0 0 L 10 5 L 0 10 z" fill="${t.accent}"></path>
        </marker>`).join('');

      let svg = `<defs>${markerDefs}</defs>`;
      (view.edges || []).forEach((edge, index) => {
        const from = nodeMap[edge.from];
        const to = nodeMap[edge.to];
        if (!from || !to) return;
        const g = edgeGeometry(from, to);
        const theme = themes[edge.theme] || themes.blue;
        const marker = `url(#arrow-${edge.theme || 'blue'})`;
        svg += `<path class="edge${edge.flow ? ' flow' : ''}" data-from="${edge.from}" data-to="${edge.to}" d="${g.path}" stroke="${theme.accent}" marker-end="${marker}" ${edge.bidirectional ? `marker-start="${marker}"` : ''}></path>`;
        if (edge.label) {
          const width = Math.max(48, edge.label.length * 11 + 18);
          svg += `<g class="edge-label"><rect x="${g.labelX - width / 2}" y="${g.labelY - 11}" width="${width}" height="22"></rect><text x="${g.labelX}" y="${g.labelY}">${edge.label}</text></g>`;
        }
      });
      el.edgeLayer.innerHTML = svg;
    }

    function renderBreadcrumb() {
      el.breadcrumb.innerHTML = state.path.map((id, index) => {
        const current = index === state.path.length - 1;
        return `${index ? '<span class="crumb-sep">/</span>' : ''}<button class="crumb ${current ? 'current' : ''}" data-index="${index}" ${current ? 'disabled' : ''}>${views[id].label}</button>`;
      }).join('');
      el.backBtn.disabled = state.path.length === 1;
    }

    function renderStepper(step) {
      document.querySelectorAll('.step').forEach(item => {
        const s = Number(item.dataset.step);
        item.classList.toggle('active', s === step);
        item.classList.toggle('done', s < step);
      });
    }

    function renderInspector() {
      const view = currentView();
      const node = view.nodes.find(n => n.id === state.selectedId);
      if (!node) {
        el.inspectorBody.innerHTML = `
          <div class="empty-inspector">
            <div>
              <div class="empty-icon">${icon('search')}</div>
              <strong>选择一个节点</strong>
              <p>进入第三层后，点击 Runtime、Broker、Bookie 等实例，可查看 CPU、内存、吞吐、延迟和最近事件。</p>
            </div>
          </div>`;
        return;
      }

      const d = node.detail || makeDetail(node.id, node.subtitle || node.title);
      const spark = sparkline(d.values || []);
      const status = node.status || 'unknown';
      const theme = themes[node.theme] || themes.blue;
      el.inspectorBody.innerHTML = `
        <div class="detail-hero">
          <div class="detail-title-row">
            <div class="detail-icon" style="color:${theme.accent};background:${theme.soft};border-color:${theme.border}">${icon(node.icon)}</div>
            <div><h4>${node.title}</h4><p>${d.role}</p></div>
            <div class="detail-status">${statusPill(status)}</div>
          </div>
          <div class="detail-address"><span>地址</span><code>${d.address}</code></div>
        </div>

        <div class="detail-section">
          <h5>实时指标</h5>
          <div class="detail-grid">
            <div class="detail-kpi"><span>事件吞吐</span><strong>${d.events}</strong></div>
            <div class="detail-kpi"><span>P95 延迟</span><strong>${d.latency} ms</strong></div>
            <div class="detail-kpi"><span>活跃连接</span><strong>${d.connections}</strong></div>
            <div class="detail-kpi"><span>节点版本</span><strong>${d.version}</strong></div>
          </div>
        </div>

        <div class="detail-section">
          <h5>资源使用</h5>
          <div class="resource-row"><div class="resource-label"><span>CPU</span><strong>${d.cpu}%</strong></div><div class="resource-track ${d.cpu > 75 ? 'warning' : ''}"><span style="width:${d.cpu}%"></span></div></div>
          <div class="resource-row"><div class="resource-label"><span>内存</span><strong>${d.memory}%</strong></div><div class="resource-track ${d.memory > 80 ? 'warning' : ''}"><span style="width:${d.memory}%"></span></div></div>
        </div>

        <div class="detail-section">
          <h5>近 15 分钟吞吐趋势</h5>
          <div class="spark-card"><div class="spark-head"><span>events / second</span><strong>${d.throughput}</strong></div>${spark}</div>
        </div>

        <div class="detail-section">
          <h5>基础信息</h5>
          <table class="detail-table">
            <tr><td>所属视图</td><td>${view.label}</td></tr>
            <tr><td>角色</td><td>${d.role}</td></tr>
            <tr><td>运行时长</td><td>${d.uptime}</td></tr>
            <tr><td>最后检查</td><td>刚刚</td></tr>
          </table>
        </div>

        <div class="detail-section">
          <h5>最近事件</h5>
          <div class="log-list">
            ${(d.logs || []).map((log, i) => `<div class="log-item ${status === 'warning' && i === 0 ? 'warning' : ''}"><time>${log[0]}</time><span>${log[1]}</span></div>`).join('')}
          </div>
        </div>`;
    }

    function sparkline(values) {
      const width = 280, height = 58, pad = 3;
      if (!values.length) return `<svg viewBox="0 0 ${width} ${height}"></svg>`;
      const min = Math.min(...values), max = Math.max(...values);
      const points = values.map((v, i) => {
        const x = pad + (i / (values.length - 1)) * (width - pad * 2);
        const y = height - pad - ((v - min) / Math.max(1, max - min)) * (height - pad * 2);
        return [x, y];
      });
      const line = points.map((p, i) => `${i ? 'L' : 'M'} ${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join(' ');
      const area = `${line} L ${points[points.length - 1][0].toFixed(1)} ${height} L ${points[0][0].toFixed(1)} ${height} Z`;
      return `<svg viewBox="0 0 ${width} ${height}" preserveAspectRatio="none"><defs><linearGradient id="sparkFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#60a5fa" stop-opacity="0.35"/><stop offset="1" stop-color="#60a5fa" stop-opacity="0"/></linearGradient></defs><path d="${area}" fill="url(#sparkFill)"></path><path d="${line}" fill="none" stroke="#2563eb" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"></path></svg>`;
    }

    function render() {
      const view = currentView();
      el.viewTitle.textContent = view.title;
      el.viewSubtitle.textContent = view.subtitle;
      el.stage.style.height = `${view.height || 700}px`;
      el.edgeLayer.setAttribute('viewBox', `0 0 1180 ${view.height || 700}`);
      renderEdges(view);
      renderNodes(view);
      renderBreadcrumb();
      renderStepper(view.step || 1);
      renderInspector();
      requestAnimationFrame(() => {
        const selected = el.nodeLayer.querySelector(`[data-id="${CSS.escape(state.selectedId || '')}"]`);
        if (selected) selected.scrollIntoView({ block: 'nearest', inline: 'nearest', behavior: 'smooth' });
      });
    }

    function navigateTo(viewId) {
      if (!views[viewId] || currentViewId() === viewId) return;
      state.path.push(viewId);
      state.selectedId = null;
      state.search = '';
      el.searchInput.value = '';
      render();
    }

    function goBack() {
      if (state.path.length <= 1) return;
      state.path.pop();
      state.selectedId = null;
      render();
    }

    function goHome() {
      state.path = ['overview'];
      state.selectedId = null;
      state.search = '';
      el.searchInput.value = '';
      render();
    }

    function selectNode(id) {
      state.selectedId = id;
      render();
    }

    function applySearch() {
      const term = (state.search || '').trim().toLowerCase();
      const view = currentView();
      el.nodeLayer.querySelectorAll('.topology-node').forEach(card => {
        const node = view.nodes.find(n => n.id === card.dataset.id);
        const haystack = `${node.id} ${node.title} ${node.subtitle || ''} ${(node.items || []).map(i => typeof i === 'string' ? i : i.label).join(' ')}`.toLowerCase();
        const hit = !term || haystack.includes(term);
        card.classList.toggle('search-dim', Boolean(term) && !hit);
        card.classList.toggle('search-hit', Boolean(term) && hit);
      });
    }

    function highlightEdges(nodeId, active) {
      el.edgeLayer.querySelectorAll(`.edge[data-from="${CSS.escape(nodeId)}"], .edge[data-to="${CSS.escape(nodeId)}"]`).forEach(path => path.classList.toggle('active', active));
    }

    function showToast(message) {
      el.toast.textContent = message;
      el.toast.classList.add('show');
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => el.toast.classList.remove('show'), 1900);
    }

    function refreshData() {
      const throughput = (30.8 + Math.random() * 2.2).toFixed(1);
      const latency = Math.round(16 + Math.random() * 5);
      el.throughputTop.textContent = `${throughput}k/s`;
      el.latencyTop.textContent = `${latency} ms`;
      el.updatedAt.textContent = new Date().toLocaleTimeString('zh-CN', { hour12: false });
      const view = currentView();
      view.nodes.forEach(node => {
        if (!node.detail) return;
        const deltaCpu = Math.round(Math.random() * 6 - 3);
        const deltaMem = Math.round(Math.random() * 4 - 2);
        node.detail.cpu = Math.max(8, Math.min(96, node.detail.cpu + deltaCpu));
        node.detail.memory = Math.max(15, Math.min(96, node.detail.memory + deltaMem));
        node.detail.values = node.detail.values.slice(1).concat(Math.max(18, Math.min(92, node.detail.values.at(-1) + Math.round(Math.random() * 16 - 8))));
      });
      render();
      showToast('拓扑指标已刷新');
    }

    function clearDemoTimers() {
      state.demoTimers.forEach(clearTimeout);
      state.demoTimers = [];
      el.demoBtn.textContent = '▶ 演示下钻';
    }

    function playDemo() {
      clearDemoTimers();
      goHome();
      el.demoBtn.textContent = '■ 停止演示';
      const schedule = (delay, fn) => state.demoTimers.push(setTimeout(fn, delay));
      schedule(900, () => navigateTo('eventmesh'));
      schedule(2100, () => navigateTo('runtime'));
      schedule(3400, () => selectNode('runtime-03'));
      schedule(4800, () => {
        el.demoBtn.textContent = '▶ 演示下钻';
        showToast('演示完成：全局 → EventMesh → Runtime → 节点详情');
      });
    }

    el.nodeLayer.addEventListener('click', event => {
      const card = event.target.closest('.topology-node');
      if (!card) return;
      const node = currentView().nodes.find(n => n.id === card.dataset.id);
      if (!node) return;
      if (node.drill) navigateTo(node.drill);
      else selectNode(node.id);
    });

    el.nodeLayer.addEventListener('keydown', event => {
      if (event.key !== 'Enter' && event.key !== ' ') return;
      const card = event.target.closest('.topology-node');
      if (!card) return;
      event.preventDefault();
      card.click();
    });

    el.nodeLayer.addEventListener('mouseover', event => {
      const card = event.target.closest('.topology-node');
      if (card) highlightEdges(card.dataset.id, true);
    });

    el.nodeLayer.addEventListener('mouseout', event => {
      const card = event.target.closest('.topology-node');
      if (card) highlightEdges(card.dataset.id, false);
    });

    el.breadcrumb.addEventListener('click', event => {
      const button = event.target.closest('.crumb');
      if (!button || button.classList.contains('current')) return;
      const index = Number(button.dataset.index);
      state.path = state.path.slice(0, index + 1);
      state.selectedId = null;
      render();
    });

    el.backBtn.addEventListener('click', goBack);
    el.homeBtn.addEventListener('click', goHome);
    el.refreshBtn.addEventListener('click', refreshData);
    el.closeInspector.addEventListener('click', () => { state.selectedId = null; render(); });
    el.searchInput.addEventListener('input', event => { state.search = event.target.value; applySearch(); });
    el.demoBtn.addEventListener('click', () => {
      if (el.demoBtn.textContent.includes('停止')) {
        clearDemoTimers();
        showToast('已停止演示');
      } else {
        playDemo();
      }
    });

    el.brandIcon.innerHTML = icon('mesh');
    render();
  </script>
</body>
</html>
